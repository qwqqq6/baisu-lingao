<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>百日临高：执委会裁断</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">百</span>
          <div>
            <h1>百日临高：执委会裁断</h1>
            <p>文德嗣的登陆后一百日</p>
          </div>
        </div>
        <nav class="top-actions" aria-label="游戏操作">
          <button id="newGameBtn" class="ghost-button" type="button">新局</button>
          <button id="continueBtn" class="ghost-button" type="button">继续</button>
          <button id="helpBtn" class="ghost-button" type="button">说明</button>
        </nav>
      </header>

      <main class="game-layout">
        <section class="left-panel" aria-label="局势">
          <div class="day-card">
            <div class="eyebrow">当前日期</div>
            <div class="day-line"><span id="dayValue">D+1</span><span id="stageName">登陆阶段</span></div>
            <div class="stage-track" aria-hidden="true">
              <span></span><span></span><span></span><span></span>
              <b id="stageProgress"></b>
            </div>
            <p id="stageTheme">卸载、安营、清点、第一接触</p>
          </div>

          <div class="metrics" id="metrics" aria-label="四柱指标"></div>

          <div class="wind-panel">
            <div class="panel-title">风声</div>
            <p id="windText">海风很静，外界尚未看清临高的轮廓。</p>
          </div>

          <div class="settings-panel">
            <label class="toggle-row">
              <input id="preciseToggle" type="checkbox" />
              <span>显示精确数值</span>
            </label>
            <label class="toggle-row">
              <input id="autosaveToggle" type="checkbox" checked />
              <span>自动存档</span>
            </label>
          </div>
        </section>

        <section class="table-panel" aria-label="事件卡">
          <div class="choice-hints" aria-hidden="true">
            <div id="leftHint" class="choice-hint left">左划</div>
            <div id="rightHint" class="choice-hint right">右划</div>
          </div>

          <article id="card" class="event-card" tabindex="0" aria-live="polite">
            <div class="card-head">
              <span id="cardType" class="card-type">阶段报告</span>
              <span id="cardCost" class="card-cost">不耗时</span>
            </div>
            <h2 id="cardTitle">准备登陆</h2>
            <p id="cardSource" class="card-source">执委会</p>
            <p id="cardText" class="card-text">点击“新局”开始。</p>
            <div id="cardTags" class="card-tags"></div>
            <div id="effectPreview" class="effect-preview"></div>
          </article>

          <div class="decision-row" aria-label="选择">
            <button id="leftBtn" class="decision-button left" type="button">
              <span class="keycap">A</span>
              <span id="leftLabel">左划</span>
            </button>
            <button id="rightBtn" class="decision-button right" type="button">
              <span id="rightLabel">右划</span>
              <span class="keycap">D</span>
            </button>
          </div>
        </section>

        <aside class="right-panel" aria-label="记录">
          <section class="report-box">
            <div class="panel-title">阶段提示</div>
            <p id="phaseNote">登陆阶段重在卸载、警戒和第一接触。任何急躁都会留下痕迹。</p>
          </section>

          <section class="history-box">
            <div class="panel-title">裁断记录</div>
            <ol id="historyList"></ol>
          </section>
        </aside>
      </main>

      <dialog id="modal" class="modal">
        <div class="modal-card">
          <div class="modal-head">
            <h2 id="modalTitle">说明</h2>
            <button id="modalClose" class="icon-button" type="button" aria-label="关闭">×</button>
          </div>
          <div id="modalBody" class="modal-body"></div>
          <div class="modal-actions">
            <button id="modalPrimary" class="primary-button" type="button">知道了</button>
          </div>
        </div>
      </dialog>
    </div>

    <script src="./src/data.js"></script>
    <script src="./src/app.js"></script>
  </body>
</html>
